name: Homepage and workspace browser checks
on:
  push:
    paths:
      - 'static/**'
      - 'tests/browser_home_animation_check.py'
      - 'tests/browser_landing_cmd_check.py'
      - 'tests/browser_imported_table_fit_check.py'
      - 'tests/browser_inventory_condition_check.py'
      - 'tests/browser_inventory_concurrency_check.py'
      - '.github/workflows/home-layout.yml'
  pull_request:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify homepage and workspaces
        env:
          AVTRACK_SCREENSHOT_DIR: work/screenshots
        run: python tests/browser_home_animation_check.py
      - name: Verify automatic landing terminal and commands
        run: python tests/browser_landing_cmd_check.py
      - name: Verify imported table content sizing
        run: python tests/browser_imported_table_fit_check.py
      - name: Verify inventory batches, condition and shelf notes
        run: python tests/browser_inventory_condition_check.py
      - name: Verify stale inventory edits cannot overwrite newer stock
        run: python tests/browser_inventory_concurrency_check.py
      - name: Upload external screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avtrack-layout-screenshots
          path: work/screenshots/*.png
          if-no-files-found: warn
      - name: Publish requested inventory screenshot
        if: github.ref == 'refs/heads/main' && success() && contains(github.event.head_commit.message, '[inventory-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_inventory_screenshot.py
      - name: Publish requested workspace screenshots
        if: github.ref == 'refs/heads/main' && success() && contains(github.event.head_commit.message, '[workspace-preview]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python scripts/publish_workspace_previews.py
