name: Full application audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-audit.yml'
      - 'scripts/run_browser_audit.py'
permissions:
  contents: read
jobs:
  source-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pip-audit
      - name: Check all Python and JavaScript syntax
        run: |
          python -m compileall -q .
          for source in static/*.js; do node --check "$source"; done
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit runtime dependency advisories
        run: python -m pip_audit -r requirements.txt --progress-spinner off
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - name: Install browser and PDF verification tools
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Run every browser regression with isolated synthetic records
        env:
          AUDIT_SHARD: ${{ matrix.shard }}
          AUDIT_SHARDS: '6'
        run: python scripts/run_browser_audit.py
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-audit-${{ matrix.shard }}
          path: work/audit
          if-no-files-found: warn
